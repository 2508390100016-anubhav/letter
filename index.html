<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter to Rose</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #07070b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }
    #terminal-box {
      background: #0b0b12;
      border: 1px solid #1a1a2e;
      border-radius: 8px;
      padding: 18px 24px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(230, 60, 90, 0.15);
    }
    pre {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 2.5px;
      user-select: none;
      white-space: pre;
    }
    @media (max-width: 650px) {
      pre {
        font-size: 7.5px;
        letter-spacing: 1.2px;
        line-height: 1.05;
      }
      #terminal-box {
        padding: 8px;
      }
    }
    @media (min-width: 651px) {
      pre {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div id="terminal-box">
    <pre id="output"></pre>
  </div>

  <script>
    const output = document.getElementById("output");
    const ROWS = 36;
    const COLS = 64;
    const CHARS = "01$#@%&*+=~-/:;|<>{}[]()";

    function rndChar() {
      return CHARS[Math.floor(Math.random() * CHARS.length)];
    }

    // 1. Envelope / Letter Model
    function getEnvelope(r, c) {
      const top = 6, bot = 29, left = 8, right = 56;
      if (r < top || r > bot || c < left || c > right) return null;

      // Outer border
      if (r === top || r === bot) return { ch: '=', col: '#b8a9c9' };
      if (c === left || c === right) return { ch: '|', col: '#b8a9c9' };

      // Top Flap diagonal folds: \       /
      const midC = (left + right) / 2;
      const flapY = top + Math.abs(c - midC) * 0.45;
      if (Math.abs(r - flapY) < 0.6 && r <= top + 11) {
        return { ch: c < midC ? '\\' : '/', col: '#d4c2fc' };
      }

      // Bottom fold diagonals: /       \
      const botFlapY = bot - Math.abs(c - midC) * 0.35;
      if (Math.abs(r - botFlapY) < 0.6 && r >= bot - 8) {
        return { ch: c < midC ? '/' : '\\', col: '#8a7fa8' };
      }

      // Central Heart Seal on the envelope
      const hx = (c - midC) / 4.2;
      const hy = -(r - (top + 9)) / 4.2;
      const a = hx * hx + hy * hy - 1;
      if (a * a * a - hx * hx * hy * hy * hy <= 0) {
        return { ch: '@', col: '#ff3d71' };
      }

      // Inner letter parchment texture
      if (r > top + 11 && r < bot - 3 && r % 2 === 0 && c > left + 4 && c < right - 4) {
        return { ch: '-', col: '#4a4361' };
      }

      return { ch: ' ', col: '#000' };
    }

    // 2. Blooming Rose Model (Head, Leaves, Stem)
    function getRose(r, c) {
      const midC = COLS / 2;
      const headCenterY = 12;

      // Rose Head / Petals
      const dx = (c - midC) / 8.5;
      const dy = (r - headCenterY) / 6.5;
      const d = Math.sqrt(dx * dx + dy * dy);

      if (d <= 1.15) {
        const angle = Math.atan2(dy, dx);
        const spiral = Math.sin(angle * 3.5 + d * 5.0);
        if (spiral > -0.35) {
          const intensity = 1 - (d / 1.15);
          // Red-Orange blooming core
          const red = 255;
          const green = Math.floor(45 + intensity * 90);
          const blue = Math.floor(30 + intensity * 40);
          return { ch: rndChar(), col: `rgb(${red}, ${green}, ${blue})` };
        }
      }

      // Stem
      if (r >= 18 && r <= 32) {
        const stemCurve = midC + Math.sin(r * 0.35) * 1.5;
        if (Math.abs(c - stemCurve) < 1.1) {
          return { ch: '|', col: '#38b000' };
        }
      }

      // Green Leaves
      // Left leaf
      const ldx = (c - (midC - 6.5)) / 5.5;
      const ldy = (r - 21) / 3.0;
      if (ldx * ldx + ldy * ldy <= 1.0 && (ldx + ldy) > -0.4) {
        return { ch: '%', col: '#70e000' };
      }

      // Right leaf
      const rdx = (c - (midC + 7)) / 5.5;
      const rdy = (r - 25) / 3.0;
      if (rdx * rdx + rdy * rdy <= 1.0 && (rdx - rdy) < 0.4) {
        return { ch: '&', col: '#70e000' };
      }

      // Blue horizontal rays radiating from center
      const rayDist = Math.abs(r - headCenterY);
      if (rayDist <= 4 && Math.abs(c - midC) > 10 && Math.abs(c - midC) < 28) {
        if (Math.random() < 0.18) {
          return { ch: '-', col: 'rgba(90, 160, 255, 0.45)' };
        }
      }

      return null;
    }

    let progress = 0;

    function draw() {
      // Timeline speed
      progress += 0.007;

      let html = "";
      const envelopeFade = Math.min(1, Math.max(0, (progress - 0.75) / 0.65));
      const roseFade = Math.min(1, Math.max(0, (progress - 1.0) / 0.7));

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const env = getEnvelope(r, c);
          const rose = getRose(r, c);

          if (progress < 0.75) {
            // Stage 1: Envelope appearing
            if (env && env.ch !== ' ') {
              if (Math.random() < Math.min(1, progress * 1.8)) {
                html += `<span style="color:${env.col}">${env.ch}</span>`;
              } else {
                html += " ";
              }
            } else {
              html += " ";
            }
          } else if (progress >= 0.75 && progress < 1.45) {
            // Stage 2: Envelope dissolving into Rose
            if (rose && Math.random() < roseFade) {
              html += `<span style="color:${rose.col}">${rose.ch}</span>`;
            } else if (env && env.ch !== ' ' && Math.random() > envelopeFade) {
              const char = Math.random() < envelopeFade ? rndChar() : env.ch;
              html += `<span style="color:${env.col}; opacity:${1 - envelopeFade * 0.7}">${char}</span>`;
            } else {
              html += " ";
            }
          } else {
            // Stage 3: Fully bloomed Rose with twinkling petals
            if (rose) {
              html += `<span style="color:${rose.col}">${rose.ch}</span>`;
            } else {
              html += " ";
            }
          }
        }
        html += "\n";
      }

      output.innerHTML = html;
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
