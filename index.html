<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter to Rose</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #07070b;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }
    #container {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    pre {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 2px;
      user-select: none;
      white-space: pre;
    }
    @media (max-width: 600px) {
      pre {
        font-size: 8px;
        letter-spacing: 1px;
      }
    }
    @media (min-width: 601px) {
      pre {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <pre id="display"></pre>
  </div>

  <script>
    const display = document.getElementById("display");
    const ROWS = 38;
    const COLS = 64;
    const CHARS = "01$#@%&*+=~-/:;|<>{}[]()";

    function rndChar() {
      return CHARS[Math.floor(Math.random() * CHARS.length)];
    }

    // Envelope / Letter test
    function getEnvelopeChar(r, c) {
      const top = 6, bottom = 32, left = 8, right = 56;
      if (r < top || r > bottom || c < left || c > right) return null;

      // Outer border
      if (r === top || r === bottom || c === left || c === right) {
        return { ch: '#', color: 'rgba(210, 160, 240, 0.9)' };
      }

      // Envelope flap diagonals
      const centerCol = (left + right) / 2;
      const flapY = top + Math.abs(c - centerCol) * 0.7;
      if (Math.abs(r - flapY) < 0.8 && r <= top + 15) {
        return { ch: '/', color: 'rgba(180, 140, 255, 0.85)' };
      }

      // Small heart seal in center of letter
      const hx = (c - centerCol) / 5.5;
      const hy = -(r - (top + 13)) / 5.5;
      const a = hx * hx + hy * hy - 1;
      if (a * a * a - hx * hx * hy * hy * hy <= 0) {
        return { ch: '@', color: 'rgba(255, 60, 90, 0.95)' };
      }

      // Inner letter texture lines
      if (r > top + 16 && r < bottom - 3 && (r % 2 === 0) && c > left + 6 && c < right - 6) {
        return { ch: '=', color: 'rgba(200, 190, 150, 0.35)' };
      }

      return { ch: '.', color: 'rgba(120, 100, 160, 0.15)' };
    }

    // Rose geometry (Rose bud + Leaves + Stem)
    function getRoseChar(r, c) {
      const cx = COLS / 2;
      const cy = 13;

      // 1. Rose Flower Bud (layered petals)
      const dx = (c - cx) / 10;
      const dy = (r - cy) / 8;
      const d = Math.sqrt(dx * dx + dy * dy);

      if (d <= 1.05) {
        const swirl = Math.sin(Math.atan2(dy, dx) * 3 + d * 4);
        if (swirl > -0.2) {
          const redVal = Math.floor(255 - d * 30);
          const greenVal = Math.floor(40 + swirl * 40);
          return { ch: rndChar(), color: `rgb(${redVal}, ${greenVal}, 70)` };
        }
      }

      // 2. Stem
      if (r >= 20 && r <= 35) {
        const stemX = cx + Math.sin(r * 0.3) * 1.2;
        if (Math.abs(c - stemX) < 1.1) {
          return { ch: '|', color: 'rgba(60, 200, 90, 0.9)' };
        }
      }

      // 3. Leaves
      // Left leaf
      const ldx = (c - (cx - 7)) / 6;
      const ldy = (r - 24) / 3.5;
      if (ldx * ldx + ldy * ldy < 1 && (ldx + ldy) > -0.3) {
        return { ch: '%', color: 'rgba(80, 220, 110, 0.85)' };
      }

      // Right leaf
      const rdx = (c - (cx + 7)) / 6;
      const rdy = (r - 27) / 3.5;
      if (rdx * rdx + rdy * rdy < 1 && (rdx - rdy) < 0.3) {
        return { ch: '&', color: 'rgba(80, 220, 110, 0.85)' };
      }

      return null;
    }

    let phase = 0; // 0 = Letter reveal, 1 = Morphing/Burst, 2 = Blooming Rose
    let progress = 0;

    function render() {
      progress += 0.008;
      if (progress < 1.0) {
        phase = 0; // Letter
      } else if (progress < 1.8) {
        phase = 1; // Transition burst
      } else {
        phase = 2; // Rose reveal
      }

      let html = "";
      const transFactor = Math.min(1, Math.max(0, (progress - 1.0) / 0.8));

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const env = getEnvelopeChar(r, c);
          const rose = getRoseChar(r, c);

          if (phase === 0) {
            // Letter phase
            if (env && Math.random() < Math.min(1, progress * 1.4)) {
              html += `<span style="color:${env.color}">${env.ch}</span>`;
            } else {
              html += " ";
            }
          } else if (phase === 1) {
            // Morph phase: envelope dissolves, rose starts emerging
            if (rose && Math.random() < transFactor) {
              html += `<span style="color:${rose.color}">${rose.ch}</span>`;
            } else if (env && Math.random() > transFactor * 1.2) {
              html += `<span style="color:${env.color}; opacity:${1 - transFactor}">${rndChar()}</span>`;
            } else {
              html += " ";
            }
          } else {
            // Full Rose glowing phase
            if (rose) {
              html += `<span style="color:${rose.color}">${rose.ch}</span>`;
            } else {
              // Soft background sparks
              if (Math.random() < 0.006) {
                html += `<span style="color:rgba(255, 120, 160, 0.4)">.</span>`;
              } else {
                html += " ";
              }
            }
          }
        }
        html += "\n";
      }

      display.innerHTML = html;
      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
