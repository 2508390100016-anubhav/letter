<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Glowing Heart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050508;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }
    #matrix-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    pre {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 2px;
      user-select: none;
      white-space: pre;
      text-shadow: 0 0 8px rgba(255, 60, 60, 0.4);
    }
    /* Mobile responsive sizing */
    @media (max-width: 600px) {
      pre {
        font-size: 8px;
        letter-spacing: 1px;
      }
    }
    @media (min-width: 601px) {
      pre {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div id="matrix-container">
    <pre id="output"></pre>
  </div>

  <script>
    const output = document.getElementById("output");

    // Grid size
    const ROWS = 36;
    const COLS = 62;
    const CHARS = "01$#@%&*+=~-/:;|<>{}[]()";

    function insideHeart(x, y) {
      // Math formula for heart curve: (x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0
      const nx = (x - COLS / 2) / (COLS * 0.28);
      const ny = -(y - ROWS * 0.45) / (ROWS * 0.32);
      const a = nx * nx + ny * ny - 1;
      return (a * a * a - nx * nx * ny * ny * ny) <= 0;
    }

    function distanceToHeartBorder(x, y) {
      const nx = (x - COLS / 2) / (COLS * 0.28);
      const ny = -(y - ROWS * 0.45) / (ROWS * 0.32);
      const a = nx * nx + ny * ny - 1;
      return a * a * a - nx * nx * ny * ny * ny;
    }

    let progress = 0; // 0 (full matrix) to 1 (isolated heart)
    let frame = 0;

    function render() {
      frame++;
      let html = "";

      // Progressively carve out the heart like in the video
      if (progress < 1) {
        progress += 0.006;
      }

      const pulse = 1 + 0.04 * Math.sin(frame * 0.1);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const adjC = (c - COLS / 2) / pulse + COLS / 2;
          const adjR = (r - ROWS / 2) / pulse + ROWS / 2;

          const isHeart = insideHeart(adjC, adjR);
          const dist = distanceToHeartBorder(adjC, adjR);

          // Random ASCII character
          const ch = CHARS[Math.floor(Math.random() * CHARS.length)];

          if (isHeart) {
            // Heart core gradient: Bright glowing orange/red in center
            const intensity = Math.min(1, Math.max(0.3, 1 - Math.abs(dist) * 1.5));
            const red = 255;
            const green = Math.floor(70 + 130 * (1 - intensity));
            const blue = Math.floor(40 + 70 * (1 - intensity));

            // Small twinkle
            const alpha = 0.8 + Math.random() * 0.2;
            html += `<span style="color: rgba(${red}, ${green}, ${blue}, ${alpha}); font-weight: bold;">${ch}</span>`;
          } else {
            // Background matrix fades out as progress increases
            const fadeThreshold = Math.random();
            const rayDist = Math.abs(r - ROWS * 0.45);

            if (fadeThreshold > progress) {
              // Outer ambient blue / dark cyan glow
              if (rayDist < 6 && Math.random() > 0.4) {
                html += `<span style="color: rgba(90, 160, 255, 0.55);">${ch}</span>`;
              } else {
                html += `<span style="color: rgba(140, 140, 160, 0.25);">${ch}</span>`;
              }
            } else if (dist < 0.25 && Math.random() < (1 - progress) * 0.5) {
              // Aura particles around the edge
              html += `<span style="color: rgba(255, 100, 120, 0.35);">${ch}</span>`;
            } else {
              html += " ";
            }
          }
        }
        html += "\n";
      }

      output.innerHTML = html;
      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
